spring.application.name=backend

# Render (like Railway/Fly) injects a PORT env var the app must bind to -
# Spring Boot doesn't read a bare PORT by default (only SERVER_PORT via
# relaxed binding). Falls back to the usual 8080 locally, where PORT is
# never set.
server.port=${PORT:8080}

# DB_URL/DB_USERNAME have local-dev defaults so a fresh checkout still runs
# against the conventional local Postgres setup without extra config.
# DB_PASSWORD has no default - startup fails fast if it isn't set, rather
# than silently falling back to a value that could end up committed here.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/immaculate_grid}
spring.datasource.username=${DB_USERNAME:grid}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool sized for a serverless Postgres (Neon), where the bill is
# compute *time*, not queries: Neon only suspends a compute endpoint once
# nothing is connected to it, so an idle pool holding connections open keeps
# it billing 24/7 regardless of traffic. That is exactly what exhausted the
# free-tier compute allowance on 2026-09-19 (the site 500'd on every
# DB-backed endpoint until the plan was upgraded) - at ~70 plays a day, the
# allowance went on an idle pool rather than on players.
#
# minimum-idle=0 is the setting that matters: Hikari otherwise keeps
# maximum-pool-size connections open forever, so the pool never drains and
# Neon's autosuspend timer never starts. Everything else just shortens how
# long a connection lingers after the last request. Do NOT set
# spring.datasource.hikari.keepalive-time - it pings idle connections, which
# would defeat all of this. These are safe against a normal always-on
# Postgres too, so local dev behaves the same, just with a smaller pool.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
# Well above this app's real concurrency (one small Render instance, no
# scheduled work) and below Neon's per-endpoint connection ceiling.
spring.datasource.hikari.maximum-pool-size=5
# Fail fast instead of Hikari's 30s default: when the database genuinely is
# unreachable, every page previously hung on its loading spinner for a full
# 30 seconds before showing an error. Still generous enough to cover a Neon
# compute cold start, which is sub-second to a few seconds.
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
# Off by default - this logs raw SQL (including real emails/tokens bound as
# query params) to the console, harmless for a local Postgres only you can
# see but not something to run against production. Set JPA_SHOW_SQL=true
# locally when you actually need to see the generated SQL.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Comma-separated list; only the local Vite dev origin by default. Override
# via CORS_ALLOWED_ORIGINS once a real frontend domain exists.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# GOOGLE_CLIENT_ID/SECRET have no default, same DB_PASSWORD rationale -
# see docs/ARCHITECTURE.md's Local environment setup section.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.auth.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.auth.session-ttl-days=${AUTH_SESSION_TTL_DAYS:30}

# Comma-separated allowlist of admin emails, gating /api/admin/**. Empty
# default is deliberate - fails "closed" (nobody, including the real admin,
# passes) rather than defaulting to any unsafe value. Must be set explicitly
# on the real production deployment, not just local dev.
app.admin.emails=${ADMIN_EMAILS:}

# ISO date (yyyy-MM-dd) the real site actually went live - empty default
# means no floor on the Archive's rolling window (correct for local dev).
# Set explicitly on the real production deployment so the Archive can
# never fabricate a playable "puzzle" for a date before the site existed.
app.archive.launch-date=${ARCHIVE_LAUNCH_DATE:}