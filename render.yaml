# Render Blueprint for the backend - see docs/ARCHITECTURE.md's deployment
# notes. `sync: false` on every env var means "this key must exist, set its
# real value in the Render dashboard" - no secret values are ever committed
# here, this file only declares which keys the app needs.
#
# runtime: docker, not a native Java runtime - Render has no native
# Java/Maven runtime at all (verified against render.com/docs/blueprint-spec
# after `runtime: java` was rejected as invalid on first attempt), so
# backend/Dockerfile is required. buildCommand/startCommand are ignored
# for docker services - the Dockerfile's own RUN/ENTRYPOINT govern both,
# already skipping tests there for the same reason noted in that file.
services:
  - type: web
    name: gachagrid-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
